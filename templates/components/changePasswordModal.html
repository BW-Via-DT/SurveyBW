<!-- Modal Alterar Palavra-passe -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content cp-modal-content">

      <div class="modal-header cp-modal-header">
        <h5 class="modal-title cp-modal-title" id="changePasswordModalLabel">
          <i class="fas fa-key me-2" aria-hidden="true"></i>Alterar Palavra-passe
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>

      <form id="change-password-form" novalidate>
        <div class="modal-body cp-modal-body">

          <div id="password-error" class="alert alert-danger d-none" role="alert"></div>

          <!-- Palavra-passe atual -->
          <div class="mb-3">
            <label for="current_password" class="form-label cp-label">Palavra-passe Atual</label>
            <div class="input-group cp-input-group">
              <input
                type="password"
                class="form-control cp-input"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
              />
              <button
                class="btn cp-toggle-btn toggle-password"
                type="button"
                data-target="current_password"
                aria-label="Mostrar/ocultar palavra-passe atual"
              >
                <i class="fas fa-eye-slash" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- Nova palavra-passe -->
          <div class="mb-3">
            <label for="new_password" class="form-label cp-label">Nova Palavra-passe</label>
            <div class="input-group cp-input-group">
              <input
                type="password"
                class="form-control cp-input"
                id="new_password"
                name="new_password"
                autocomplete="new-password"
                minlength="10"
                required
              />
              <button
                class="btn cp-toggle-btn toggle-password"
                type="button"
                data-target="new_password"
                aria-label="Mostrar/ocultar nova palavra-passe"
              >
                <i class="fas fa-eye-slash" aria-hidden="true"></i>
              </button>
            </div>

            <div class="progress cp-progress mt-2">
              <div
                id="password-strength-bar"
                class="progress-bar bg-danger"
                role="progressbar"
                style="width: 0%"
                aria-valuenow="0"
                aria-valuemin="0"
                aria-valuemax="100"
              ></div>
            </div>
            <small id="password-strength-text" class="form-text cp-strength-text">Força da senha: Fraca (mínimo 10 caracteres)</small>
          </div>

          <!-- Confirmar nova palavra-passe -->
          <div class="mb-1">
            <label for="confirm_password" class="form-label cp-label">Confirmar Nova Palavra-passe</label>
            <div class="input-group cp-input-group">
              <input
                type="password"
                class="form-control cp-input"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="10"
                required
              />
              <button
                class="btn cp-toggle-btn toggle-password"
                type="button"
                data-target="confirm_password"
                aria-label="Mostrar/ocultar confirmação da palavra-passe"
              >
                <i class="fas fa-eye-slash" aria-hidden="true"></i>
              </button>
            </div>
          </div>

        </div>

        <div class="modal-footer cp-modal-footer">
          <button type="button" class="cp-btn cp-btn--cancel" data-bs-dismiss="modal">
            <i class="fa fa-times" aria-hidden="true"></i> Cancelar
          </button>
          <button type="submit" class="cp-btn cp-btn--save">
            <i class="fa fa-save" aria-hidden="true"></i> Guardar Palavra-passe
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
