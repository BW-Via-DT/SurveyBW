<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SurveyBW Application</title>
    <link rel="icon" type="image/ico" href="/static/content/icon.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }
        .reset-card h4 {
            color: #051729;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.85rem 1rem;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #2EFAD9;
            box-shadow: 0 0 0 0.25rem rgba(46, 250, 217, 0.25);
        }
        .btn-reset {
            background-color: #051729;
            color: white;
            border-radius: 10px;
            padding: 0.85rem;
            width: 100%;
            border: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-reset:hover {
            background-color: #2efad9;
            color: #051729;
            transform: translateY(-2px);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-area img {
            height: 45px;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo-area">
            <img src="/static/content/logo.png" alt="SurveyBW">
            <p class="text-muted mt-2 mb-0" style="font-size:0.85rem;">SurveyBW Application · BorgWarner</p>
        </div>

        <h4 class="text-center">
            <i class="fas fa-key me-2"></i>New Password
        </h4>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} mb-3">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/reset_password/{{ token }}" method="POST">
            <div class="mb-3">
                <label class="form-label" style="color:#051729; font-weight:500;">
                    <i class="fas fa-lock me-2"></i>New Password
                </label>
                <input type="password" class="form-control" name="newPassword"
                       placeholder="Minimum 10 characters" minlength="10" required>
            </div>
            <div class="mb-4">
                <label class="form-label" style="color:#051729; font-weight:500;">
                    <i class="fas fa-lock me-2"></i>Confirm New Password
                </label>
                <input type="password" class="form-control" name="confirmPassword"
                       placeholder="Repeat the new password" minlength="10" required>
            </div>
            <button type="submit" class="btn btn-reset">
                <i class="fas fa-check me-2"></i>Save New Password
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-muted" style="font-size:0.9rem;">
                <i class="fas fa-arrow-left me-1"></i>Back to Home
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
