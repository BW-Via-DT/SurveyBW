<div
  class="modal fade"
  id="modalFirstLogin"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modalFirstLoginLabel"
  aria-hidden="true"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-info text-white border-bottom-0">
        <h5 class="modal-title font-weight-bold" id="modalFirstLoginLabel">
          <i class="fas fa-key me-2"></i> Alterar Palavra-passe
        </h5>
      </div>
      <div class="modal-body p-4">
        <div
          class="alert alert-info bg-light border-start border-info border-4 text-dark d-flex align-items-center mb-4"
        >
          <i class="fas fa-info-circle text-info me-3 fa-2x"></i>
          <div>
            Este é o seu primeiro acesso. Por motivos de segurança, é necessário
            alterar a sua palavra-passe.
          </div>
        </div>

        <form id="firstLoginForm">
          <div class="form-group mb-3">
            <label for="new_password" class="font-weight-bold text-muted small"
              >Nova Palavra-passe</label
            >
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-light border-right-0">
                  <i class="fas fa-lock text-success"></i>
                </span>
              </div>
              <input
                type="password"
                class="form-control border-left-0"
                id="new_password"
                name="new_password"
                placeholder="Escreva a nova palavra-passe"
                required
              />
            </div>
          </div>

          <div class="form-group mb-3">
            <label
              for="confirm_password"
              class="font-weight-bold text-muted small"
              >Confirmar Palavra-passe</label
            >
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-light border-right-0">
                  <i class="fas fa-check-circle text-success"></i>
                </span>
              </div>
              <input
                type="password"
                class="form-control border-left-0"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirme a nova palavra-passe"
                required
              />
            </div>
          </div>

          <div class="alert alert-danger d-none" id="password-error">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span id="password-error-message"
              >As palavras-passe não coincidem!</span
            >
          </div>

          <div
            class="modal-footer d-flex justify-content-center border-top-0 pt-3 pb-3"
          >
            <button type="button" id="firstLoginSubmitBtn" class="btn btn-success px-4 btn-lg">
              <i class="fas fa-save me-2"></i> Alterar Palavra-passe
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
