<div class="modal fade" id="changePasswordModal" tabindex="-1" role="dialog" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title font-weight-bold" id="changePasswordModalLabel">
          <i class="fas fa-key me-2"></i>Alterar Palavra-passe
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="change-password-form">
          <!-- Current Password -->
          <div class="form-group mb-4">
            <label for="current_password" class="text-sm font-weight-bold text-primary">Palavra-passe atual</label>
            <div class="input-group">
              <span class="input-group-text bg-primary text-white">
                <i class="fas fa-key"></i>
              </span>
              <input type="password" class="form-control" id="current_password" name="current_password" required />
              <span class="input-group-text bg-light toggle-password" data-target="current_password">
                <i class="fas fa-eye-slash"></i>
              </span>
            </div>
          </div>

          <!-- New Password -->
          <div class="form-group mb-4">
            <label for="new_password" class="text-sm font-weight-bold text-primary">Nova palavra-passe</label>
            <div class="input-group">
              <span class="input-group-text bg-primary text-white">
                <i class="fas fa-lock"></i>
              </span>
              <input type="password" class="form-control" id="new_password" name="new_password" required />
              <span class="input-group-text bg-light toggle-password" data-target="new_password">
                <i class="fas fa-eye-slash"></i>
              </span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group mb-4">
            <label for="confirm_password" class="text-sm font-weight-bold text-primary">Confirmar nova palavra-passe</label>
            <div class="input-group">
              <span class="input-group-text bg-primary text-white">
                <i class="fas fa-lock"></i>
              </span>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required />
              <span class="input-group-text bg-light toggle-password" data-target="confirm_password">
                <i class="fas fa-eye-slash"></i>
              </span>
            </div>
          </div>

          <!-- Password Strength -->
          <div class="password-strength mb-4">
            <div class="progress">
              <div id="password-strength-bar" class="progress-bar bg-danger" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <small id="password-strength-text" class="form-text text-muted mt-1">Força da senha: Fraca</small>
          </div>

          <!-- Error Alert -->
          <div class="alert alert-danger d-none" id="password-error">
            As palavras-passe não coincidem!
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-2"></i>Cancelar
        </button>
        <button type="submit" form="change-password-form" class="btn btn-primary">
          <i class="fas fa-save me-2"></i>Alterar Palavra-passe
        </button>
      </div>
    </div>
  </div>
</div>
