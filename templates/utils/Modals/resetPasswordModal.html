<div
  class="modal fade"
  id="resetPasswordModal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="resetPasswordModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="resetPasswordModalLabel">
          <i class="fas fa-key me-2"></i>Recuperar Palavra-Passe
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="forgotPasswordForm" method="POST">
          <div class="form-group mb-3">
            <label
              for="recover-username"
              style="color: #051729; font-weight: 500"
            >
              <i class="fas fa-user me-2"></i>Username ou E-mail
            </label>
            <input
              type="text"
              id="recover-username"
              name="recover_username"
              class="form-control"
              placeholder="Introduza o seu username ou e-mail"
              required
            />
          </div>
          <div class="form-group mb-3">
            <button type="submit" class="btn btn-login">
              <i class="fas fa-paper-plane me-2"></i>Enviar Link de Recuperação
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
