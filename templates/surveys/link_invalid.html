{% extends 'base.html' %}

{% block title %}Link inválido{% endblock %}

{% block extra_css %}
<style>
  :root {
    --teal: #0D9488;
    --teal-light: #E6FBF8;
    --ink: #101828;
    --ink-soft: #475467;
    --line: #E4E7EC;
    --bg: #F7F8FA;
    --danger: #D14343;
  }

  #invalid-link-page {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 2rem 1rem;
  }

  .invalid-card {
    max-width: 560px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: center;
    padding: 2.2rem 1.5rem;
    box-shadow: 0 14px 32px rgba(16, 24, 40, 0.05);
  }

  .invalid-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    background: var(--teal-light);
    color: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }

  .invalid-card h1 {
    margin: 0 0 0.7rem;
    color: var(--ink);
    font-size: clamp(1.6rem, 3vw, 2.2rem);
  }

  .invalid-card p {
    margin: 0;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  .invalid-card .note {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
</style>
{% endblock %}

{% block content %}
<div id="invalid-link-page">
  <div class="invalid-card">
    <div class="invalid-icon">
      <i class="fas fa-unlink"></i>
    </div>
    <h1>Link indisponível</h1>
    <p>Este formulário não está disponível ou o link expirou.</p>
    <div class="note">Se pensas que isto é um erro, contacta a pessoa que te enviou o convite.</div>
  </div>
</div>
{% endblock %}
