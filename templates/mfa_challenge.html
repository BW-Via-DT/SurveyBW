<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>SurveyBW Application - Verification</title>
    <link rel="icon" type="image/ico" href="{{ url_for('static', filename='content/icon.webp') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f4f6f8;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(50%);
        }

        .page-wrapper {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .navbar-brand img {
            height: 48px;
            margin-right: 10px;
        }

        .navbar-brand span {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .mfa-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .mfa-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: rgba(46, 250, 217, 0.15);
            color: #051729;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.25rem auto;
        }

        .mfa-card h5 {
            color: #051729;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .mfa-card p.subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
        }

        .code-input {
            width: 100%;
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 0.6rem;
            font-weight: 600;
            padding: 0.9rem 0.5rem 0.9rem 0.9rem;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background-color: white;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            outline: none;
            border-color: #2EFAD9;
            box-shadow: 0 0 0 0.25rem rgba(46, 250, 217, 0.25);
        }

        .btn-verify {
            background-color: #051729;
            color: white;
            border-radius: 10px;
            padding: 0.9rem;
            width: 100%;
            border: none;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .btn-verify:hover:not(:disabled) {
            background-color: #2efad9;
            color: #051729;
            transform: translateY(-2px);
        }

        .btn-verify:disabled {
            opacity: 0.7;
        }

        .toggle-backup {
            background: none;
            border: none;
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 1.25rem;
            text-decoration: underline;
        }

        .toggle-backup:hover {
            color: #051729;
        }

        .back-to-login {
            display: inline-block;
            margin-top: 1.5rem;
            color: #6c757d;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-to-login:hover {
            color: #051729;
            text-decoration: underline;
        }

        .hint-text {
            font-size: 0.82rem;
            color: #9aa1a8;
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            .mfa-card { padding: 1.75rem 1.25rem; }
            .code-input { font-size: 1.3rem; letter-spacing: 0.4rem; }
        }
    </style>
</head>
<body>
    <div class="video-bg">
        <video id="bg-video" autoplay loop muted playsinline>
            <source src="{{ url_for('static', filename='content/video.mp4') }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="page-wrapper">
        <a class="navbar-brand" href="/">
            <img src="{{ url_for('static', filename='content/logo.png') }}" alt="SurveyBW Icon">
            <span>SurveyBW Application</span>
        </a>

        <div class="mfa-card">
            <div class="mfa-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h5>Two-Factor Verification</h5>
            <p class="subtitle" id="subtitleText">
                Open Microsoft Authenticator (or your authenticator app) and enter the 6-digit code for this account.
            </p>

            <form id="mfaForm" autocomplete="off">
                <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    id="mfaCode"
                    name="code"
                    class="code-input"
                    placeholder="------"
                    maxlength="6"
                    autocomplete="one-time-code"
                    required
                >
                <button type="submit" class="btn-verify" id="verifyBtn">
                    <i class="fas fa-check me-2"></i>Verify
                </button>
            </form>

            <button type="button" class="toggle-backup" id="toggleBackupBtn">
                <i class="fas fa-key me-1"></i>Use a backup code instead
            </button>

            <p class="hint-text">The code refreshes every 30 seconds.</p>

            <a href="{{ url_for('index') }}" class="back-to-login">
                <i class="fas fa-arrow-left me-1"></i>Back to login
            </a>
        </div>
    </div>

    <script nonce="{{ csp_nonce() }}">
        const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        let usingBackupCode = false;

        const codeInput = document.getElementById('mfaCode');
        const mfaForm = document.getElementById('mfaForm');
        const verifyBtn = document.getElementById('verifyBtn');
        const toggleBackupBtn = document.getElementById('toggleBackupBtn');
        const subtitleText = document.getElementById('subtitleText');

        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('bg-video');
            if (video) {
                video.play().catch(() => {});
            }
            codeInput.focus();
        });

        // Só permite dígitos no modo TOTP; no modo backup code aceita letras/números/hífen
        codeInput.addEventListener('input', function () {
            if (!usingBackupCode) {
                this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
            } else {
                this.value = this.value.replace(/[^a-zA-Z0-9-]/g, '').slice(0, 9);
            }
        });

        toggleBackupBtn.addEventListener('click', function () {
            usingBackupCode = !usingBackupCode;
            codeInput.value = '';

            if (usingBackupCode) {
                codeInput.setAttribute('inputmode', 'text');
                codeInput.setAttribute('maxlength', '9');
                codeInput.setAttribute('placeholder', 'xxxx-xxxx');
                codeInput.style.letterSpacing = '0.15rem';
                codeInput.style.fontSize = '1.3rem';
                subtitleText.textContent = 'Enter one of the backup codes you saved when you set up two-factor authentication.';
                toggleBackupBtn.innerHTML = '<i class="fas fa-mobile-screen me-1"></i>Use authenticator app instead';
            } else {
                codeInput.setAttribute('inputmode', 'numeric');
                codeInput.setAttribute('maxlength', '6');
                codeInput.setAttribute('placeholder', '------');
                codeInput.style.letterSpacing = '0.6rem';
                codeInput.style.fontSize = '1.6rem';
                subtitleText.textContent = 'Open Microsoft Authenticator (or your authenticator app) and enter the 6-digit code for this account.';
                toggleBackupBtn.innerHTML = '<i class="fas fa-key me-1"></i>Use a backup code instead';
            }
            codeInput.focus();
        });

        mfaForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const code = codeInput.value.trim();
            if (!code) return;

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verifying...';

            fetch('/mfa/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': CSRF_TOKEN
                },
                body: new URLSearchParams({ code })
            })
            .then(r => r.json().then(data => ({ status: r.status, data })))
            .then(({ status, data }) => {
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = '<i class="fas fa-check me-2"></i>Verify';

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    Swal.fire('Attention', data.message || 'Invalid code.', 'warning');
                    codeInput.value = '';
                    codeInput.focus();
                }
            })
            .catch(() => {
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = '<i class="fas fa-check me-2"></i>Verify';
                Swal.fire('Error', 'Server connection error.', 'error');
            });
        });
    </script>
</body>
</html>
